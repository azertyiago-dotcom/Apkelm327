name: Generation APK OBD2

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v4

    - name: Configuration de Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Installation de Gradle 7.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.6'

    - name: Installation des Android Build Tools et SDK 33
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.2" "platforms;android-33"

    - name: Configuration de NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Installation de Cordova
      run: npm install -g cordova@12

    - name: Création du projet et injection des fichiers
      run: |
        rm -rf appli_native
        cordova create appli_native com.obd2pro.app "OBD2 Pro"
        cp config.xml appli_native/config.xml
        rm -f appli_native/www/index.html
        rm -rf appli_native/www/js appli_native/www/css appli_native/www/img
        cp index.html appli_native/www/
        ls -la appli_native/www/
        cd appli_native
        cordova platform add android@12.0.0 --verbose

    - name: Installation des plugins
      run: |
        cd appli_native
        cordova plugin add cordova-plugin-bluetooth-classic-serial-port --save --verbose
        cordova plugin add cordova-plugin-android-permissions --save --verbose
        cordova plugin add cordova-plugin-insomnia --save --verbose

    - name: Compilation de l'APK debug
      run: |
        cd appli_native
        cordova build android --debug --verbose

    - name: Extraction de l'APK
      run: |
        mkdir -p output_apk
        find appli_native/platforms/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/ \;
        ls -la output_apk/

    - name: Livraison de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: OBD2-Pro-APK
        path: output_apk/*.apk
        if-no-files-found: error
